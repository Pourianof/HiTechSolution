name: Build and Publish Docker Images

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      store: ${{ steps.filter.outputs.store }}
      pay: ${{ steps.filter.outputs.pay }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            store:
              - 'HiTechStore/**'
              - 'HiTechStore.ApiTokenHandler/**'
              - 'HiTechPay.Sdk/**'

            pay:
              - 'HiTechPay/**'

  build-store:
    needs: detect-changes

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.store == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push HiTechStore
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./HiTechStore/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hitechstore-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hitechstore-api:${{ github.sha }}

  build-pay:
    needs: detect-changes

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.pay == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push HiTechPay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./HiTechPay/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hitechpay:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hitechpay:${{ github.sha }}
