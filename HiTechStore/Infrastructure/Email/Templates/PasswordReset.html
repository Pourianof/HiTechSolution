<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset Request</title>
  </head>
  <body
    style="
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.6;
      color: #1f2937;
    "
  >
    <p>Hello {{UserName}},</p>
    <p>
      We received a request to reset your password. To continue, click the
      button below:
    </p>
    <p>
      <a
        href="{{ResetUrl}}"
        style="
          display: inline-block;
          padding: 12px 18px;
          background: #2563eb;
          color: #ffffff;
          text-decoration: none;
          border-radius: 6px;
        "
      >
        Reset Password
      </a>
    </p>
    <p>If you did not request this, please ignore this email.</p>
    <p>Regards,<br />The HiTechStore Team</p>
  </body>
</html>
